<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>משחק הרקטה של עומר 🚀</title>
<link href="https://fonts.googleapis.com/css2?family=Secular+One&family=Rubik:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --space:#06060f; --gold:#ffd93d; --orange:#ff6b35;
  --green:#4ecdc4; --red:#ff4757; --white:#f0f4ff;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Rubik',sans-serif;background:var(--space);color:var(--white);min-height:100vh;overflow:hidden;direction:rtl;}

.stars{position:fixed;inset:0;pointer-events:none;z-index:0;}
.star{position:absolute;background:white;border-radius:50%;animation:twinkle var(--d,2s) ease-in-out infinite alternate;}
@keyframes twinkle{from{opacity:0.1}to{opacity:1}}

.game-wrapper{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:20px;gap:14px;}

h1{font-family:'Secular One',sans-serif;font-size:clamp(1.5rem,4.5vw,2.6rem);color:var(--gold);text-shadow:0 0 30px rgba(255,217,61,.5);text-align:center;}
h1 .name{color:#fff;text-shadow:0 0 20px rgba(78,205,196,.9);}

.hud{display:flex;gap:20px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.15);border-radius:50px;padding:10px 24px;backdrop-filter:blur(8px);}
.hud-item{display:flex;align-items:center;gap:8px;font-size:1.1rem;font-weight:700;}
.hud-item span:first-child{font-size:1.4rem;}

.fuel-section{width:min(420px,90vw);text-align:center;}
.fuel-label{font-size:.85rem;color:var(--gold);margin-bottom:6px;}
.fuel-bar-bg{background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.2);border-radius:50px;height:24px;overflow:hidden;}
.fuel-bar{height:100%;border-radius:50px;background:linear-gradient(90deg,#4ecdc4,#ffd93d,#ff6b35);transition:width .5s cubic-bezier(.34,1.56,.64,1);position:relative;}
.fuel-bar::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.3) 0%,transparent 60%);border-radius:50px;}

.scene{position:relative;width:min(420px,90vw);height:160px;display:flex;align-items:flex-end;justify-content:center;}
.rocket-wrap{position:absolute;bottom:0;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;}
.rocket-wrap.boost{animation:boost .4s ease;}
@keyframes boost{0%{filter:drop-shadow(0 0 0px #ffd93d)}50%{filter:drop-shadow(0 0 30px #ff6b35)}100%{filter:drop-shadow(0 0 10px #ffd93d)}}
.rocket-svg{width:65px;}
.flame{width:28px;height:40px;margin-top:-4px;border-radius:50% 50% 60% 60%;background:linear-gradient(to bottom,#fff 0%,#ffd93d 30%,#ff6b35 70%,transparent 100%);animation:flicker .15s ease-in-out infinite alternate;opacity:0;transition:opacity .3s;}
.flame.active{opacity:1;}
@keyframes flicker{from{transform:scaleX(.85) scaleY(.95)}to{transform:scaleX(1.15) scaleY(1.05)}}
.launchpad{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:110px;height:18px;background:linear-gradient(180deg,#555,#333);border-radius:6px 6px 0 0;border:1px solid #666;}
.launchpad::before,.launchpad::after{content:'';position:absolute;bottom:0;width:14px;height:26px;background:#444;border-radius:4px 4px 0 0;}
.launchpad::before{left:12px;}.launchpad::after{right:12px;}
.ground{position:absolute;bottom:0;left:0;right:0;height:3px;background:linear-gradient(90deg,transparent,rgba(78,205,196,.6),transparent);}

.question-card{background:linear-gradient(135deg,rgba(42,26,110,.8),rgba(13,13,43,.9));border:2px solid rgba(255,217,61,.3);border-radius:24px;padding:22px 30px;text-align:center;width:min(420px,90vw);backdrop-filter:blur(12px);box-shadow:0 8px 40px rgba(0,0,0,.5);}
.question-text{font-size:clamp(1.8rem,6vw,2.8rem);font-weight:900;color:var(--white);margin-bottom:14px;min-height:50px;display:flex;align-items:center;justify-content:center;direction:ltr;unicode-bidi:bidi-override;}

.ans-input{width:140px;padding:11px 14px;font-size:1.7rem;font-family:'Rubik',sans-serif;font-weight:700;text-align:center;background:rgba(255,255,255,.1);border:2px solid rgba(255,217,61,.4);border-radius:14px;color:var(--white);outline:none;caret-color:var(--gold);transition:border-color .2s,box-shadow .2s;}
.ans-input:focus{border-color:var(--gold);box-shadow:0 0 16px rgba(255,217,61,.3);}
.ans-input.correct{border-color:var(--green);box-shadow:0 0 16px rgba(78,205,196,.5);}
.ans-input.wrong{border-color:var(--red);box-shadow:0 0 16px rgba(255,71,87,.4);animation:shake .4s ease;}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}

.fire-btn{margin-top:12px;display:block;width:150px;margin-inline:auto;padding:12px;font-family:'Secular One',sans-serif;font-size:1.05rem;background:linear-gradient(135deg,var(--gold),var(--orange));color:#111;border:none;border-radius:50px;cursor:pointer;box-shadow:0 4px 20px rgba(255,107,53,.4);transition:transform .15s;}
.fire-btn:hover{transform:scale(1.04);}
.feedback-txt{font-size:1.1rem;font-weight:700;min-height:28px;margin-top:8px;}
.feedback-txt.good{color:var(--green);}
.feedback-txt.bad{color:var(--red);}

.particle{position:fixed;pointer-events:none;font-size:1.5rem;animation:floatUp 1s ease-out forwards;z-index:999;}
@keyframes floatUp{0%{transform:translateY(0) scale(1);opacity:1}100%{transform:translateY(-120px) scale(.5);opacity:0}}

.overlay{display:none;position:fixed;inset:0;z-index:100;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;}
.overlay.show{display:flex;}
#launch-overlay{background:radial-gradient(circle at 50% 65%,rgba(255,107,53,.8) 0%,rgba(6,6,15,.96) 65%);backdrop-filter:blur(4px);}
.launch-rocket{font-size:5rem;animation:flyUp 2.4s ease-in forwards;}
@keyframes flyUp{0%{transform:translateY(0)}100%{transform:translateY(-110vh)}}
.launch-title{font-family:'Secular One',sans-serif;font-size:clamp(1.7rem,6vw,3rem);color:#fff;text-shadow:0 0 28px rgba(255,255,255,.6);text-align:center;animation:pulse .6s ease-in-out infinite alternate;}
@keyframes pulse{from{transform:scale(1)}to{transform:scale(1.06)}}
.launch-score-txt{font-size:1.2rem;color:var(--gold);font-weight:700;}

.ov-card{background:linear-gradient(135deg,rgba(42,26,110,.92),rgba(13,13,43,.97));border:2px solid rgba(255,217,61,.35);border-radius:24px;padding:24px 30px;text-align:center;width:min(380px,90vw);display:none;flex-direction:column;align-items:center;gap:12px;box-shadow:0 8px 40px rgba(0,0,0,.6);animation:fadeIn .5s ease;}
.ov-card.show{display:flex;}
@keyframes fadeIn{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
.ov-card .sub{font-size:.9rem;color:rgba(255,255,255,.6);}
.ov-card .ov-q{font-size:clamp(1.5rem,5vw,2.2rem);font-weight:900;color:var(--white);direction:ltr;unicode-bidi:bidi-override;}

.skip-btn{background:rgba(255,255,255,.12);color:rgba(255,255,255,.7);border:1px solid rgba(255,255,255,.2);border-radius:50px;padding:9px 24px;font-family:'Rubik',sans-serif;font-size:.9rem;cursor:pointer;transition:background .2s;}
.skip-btn:hover{background:rgba(255,255,255,.2);}

#gameover-overlay{background:rgba(0,0,0,.93);backdrop-filter:blur(14px);}
.go-emoji{font-size:4rem;}
.go-title{font-family:'Secular One',sans-serif;font-size:clamp(1.8rem,7vw,3.2rem);color:var(--red);text-align:center;}
.go-score{font-size:1.2rem;color:var(--gold);font-weight:700;}
</style>
<script src="https://cdn.jsdelivr.net/npm/@elevenlabs/client@latest/dist/index.umd.js"></script>
</head>
<body>

<div class="stars" id="stars"></div>

<div class="game-wrapper">
  <h1>🚀 משחק הרקטה של <span class="name">עומר</span></h1>
  <div class="hud">
    <div class="hud-item"><span>⭐</span><span id="score-display">0</span></div>
    <div class="hud-item"><span>❤️</span><span id="lives-display">3</span></div>
    <div class="hud-item"><span>🔥</span><span id="streak-display">0</span></div>
    <div class="hud-item"><button id="sound-btn" onclick="activateSound()" style="background:rgba(255,217,61,0.2);border:1px solid rgba(255,217,61,0.5);border-radius:20px;color:#ffd93d;padding:4px 12px;cursor:pointer;font-size:0.9rem;font-family:Rubik,sans-serif;">🔇 קול</button></div>
  </div>
  <div class="fuel-section">
    <div class="fuel-label">⛽ דלק לרקטה של עומר</div>
    <div class="fuel-bar-bg"><div class="fuel-bar" id="fuel-bar" style="width:0%"></div></div>
  </div>
  <div class="scene">
    <div class="launchpad"></div>
    <div class="rocket-wrap" id="rocket-wrap">
      <svg class="rocket-svg" viewBox="0 0 80 120" fill="none">
        <path d="M40 8 C28 30 22 60 22 85 L58 85 C58 60 52 30 40 8Z" fill="url(#bG)"/>
        <path d="M40 8 C34 20 30 30 30 40 L50 40 C50 30 46 20 40 8Z" fill="#e0e8ff"/>
        <circle cx="40" cy="55" r="9" fill="#1a1a4e" stroke="#4ecdc4" stroke-width="2"/>
        <circle cx="37" cy="52" r="3" fill="rgba(255,255,255,0.3)"/>
        <path d="M22 75 L8 95 L22 90Z" fill="url(#wG)"/>
        <path d="M58 75 L72 95 L58 90Z" fill="url(#wG)"/>
        <rect x="28" y="82" width="24" height="6" rx="2" fill="#aab4d0"/>
        <path d="M28 65 L52 65" stroke="#ff6b35" stroke-width="3" stroke-linecap="round"/>
        <path d="M26 72 L54 72" stroke="#ffd93d" stroke-width="2" stroke-linecap="round"/>
        <defs>
          <linearGradient id="bG" x1="22" y1="8" x2="58" y2="85" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#c8d6f0"/><stop offset="100%" stop-color="#8898c0"/>
          </linearGradient>
          <linearGradient id="wG" x1="0" y1="75" x2="0" y2="95" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#ff6b35"/><stop offset="100%" stop-color="#c0392b"/>
          </linearGradient>
        </defs>
      </svg>
      <div class="flame" id="flame"></div>
    </div>
    <div class="ground"></div>
  </div>
  <div class="question-card">
    <div class="question-text" id="question-text">טוען...</div>
    <input type="number" class="ans-input" id="main-input" placeholder="?" autocomplete="off" inputmode="numeric"/>
    <button class="fire-btn" id="main-btn">✈️ שגר!</button>
    <div class="feedback-txt" id="main-fb"></div>
  </div>
</div>

<!-- LAUNCH OVERLAY -->
<div class="overlay" id="launch-overlay">
  <div class="launch-rocket">🚀</div>
  <div class="launch-title">🎉 שיגור מוצלח, עומר!<br>אתה גאון!</div>
  <div class="launch-score-txt">ניקוד: <span id="launch-score-val">0</span> ⭐</div>
  <div class="ov-card" id="launch-card">
    <div class="sub">עומר, פתור תרגיל ושגר שוב! 🚀</div>
    <div class="ov-q" id="launch-q"></div>
    <input type="number" class="ans-input" id="launch-input" placeholder="?" inputmode="numeric" autocomplete="off"/>
    <button class="fire-btn" id="launch-btn">🚀 שגר שוב!</button>
    <div class="feedback-txt" id="launch-fb"></div>
    <button class="skip-btn" id="launch-skip">דלג ←</button>
  </div>
</div>

<!-- GAME OVER OVERLAY -->
<div class="overlay" id="gameover-overlay">
  <div class="go-emoji">💥</div>
  <div class="go-title">אוי עומר!<br>נגמר הדלק!</div>
  <div class="go-score">ניקוד: <span id="final-score">0</span> ⭐</div>
  <div class="ov-card show">
    <div class="sub">פתור תרגיל כדי לנסות שוב! 💪</div>
    <div class="ov-q" id="gameover-q"></div>
    <input type="number" class="ans-input" id="gameover-input" placeholder="?" inputmode="numeric" autocomplete="off"/>
    <button class="fire-btn" id="gameover-btn">💪 נסה שוב!</button>
    <div class="feedback-txt" id="gameover-fb"></div>
    <button class="skip-btn" id="gameover-skip">דלג ←</button>
  </div>
</div>

<script>
// ── Stars ──
(function(){
  const sc = document.getElementById('stars');
  for(let i=0;i<120;i++){
    const s=document.createElement('div');
    s.className='star';
    const sz=Math.random()*2.5+0.5;
    s.style.cssText=`width:${sz}px;height:${sz}px;top:${Math.random()*100}%;left:${Math.random()*100}%;--d:${(Math.random()*2+1).toFixed(1)}s;animation-delay:${(Math.random()*3).toFixed(1)}s`;
    sc.appendChild(s);
  }
})();

// ── ElevenLabs Browser SDK ──
const EL_KEY   = 'sk_c6f1cac3fee162140ff062cea2db07d421385f224a516d52';
const EL_VOICE = 'XB0fDUnXU5powFXDhCwa'; // Charlotte
const EL_MODEL = 'eleven_turbo_v2_5';

let currentAudio = null;
let lastText     = '';
let voiceEnabled = false;
let elClient     = null;

// All phrases in English phonetics
const V = {
  intro:    "Sha-lom Oh-mer! Welcome to the rocket game! Solve math problems, fill the fuel, and launch the rocket!",
  correct:  ["Kol ha-kavod Oh-mer!", "Mad-him!", "Nach-on me-od!", "Soo-per Oh-mer!", "Ata ga-on!", "Yoh-fi shel tesh-uva!"],
  wrong:    ["Lo na-chon, na-se shuv Oh-mer!", "Taut kta-na, a-ta ya-chol!", "Od pa-am Oh-mer!"],
  launch:   "Shi-gur muts-lach! Oh-mer, a-ta a-luf a-mi-ti! Kol ha-kavod!",
  gameover: "Oy Oh-mer, nig-mar ha-de-lek! A-val a-ni yo-da-at she-a-ta ya-chol la-not shuv!",
  streak3:  "Sha-losh ba-re-tsef! Oh-mer, a-ta bo-er!",
  streak5:  "Cha-mesh ba-re-tsef! Oh-mer, a-ta pash-ut mad-him!"
};

const audioCache = {};

async function speak(text, onDone) {
  if (!voiceEnabled || !text) return;
  lastText = text;
  if (currentAudio) { try { currentAudio.pause(); currentAudio.currentTime = 0; } catch(e){} }

  // Serve from cache
  if (audioCache[text]) { playBlob(audioCache[text], onDone); return; }

  try {
    // Use ElevenLabs browser SDK if available, else fall back to fetch
    let blob;
    if (window.ElevenLabs) {
      if (!elClient) elClient = new window.ElevenLabs.ElevenLabsClient({ apiKey: EL_KEY });
      const res = await elClient.textToSpeech.convert(EL_VOICE, {
        text,
        model_id: EL_MODEL,
        voice_settings: { stability: 0.50, similarity_boost: 0.85, style: 0.35, use_speaker_boost: true }
      });
      blob = res;
    } else {
      // Fallback: direct fetch (works when CORS is open)
      const res = await fetch(`https://api.elevenlabs.io/v1/text-to-speech/${EL_VOICE}`, {
        method: 'POST',
        headers: { 'xi-api-key': EL_KEY, 'Content-Type': 'application/json', 'Accept': 'audio/mpeg' },
        body: JSON.stringify({ text, model_id: EL_MODEL,
          voice_settings: { stability: 0.50, similarity_boost: 0.85, style: 0.35, use_speaker_boost: true }
        })
      });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      blob = await res.blob();
    }
    const url = URL.createObjectURL(blob);
    audioCache[text] = url;
    playBlob(url, onDone);
  } catch(e) {
    console.warn('Voice error:', e.message);
  }
}

function playBlob(url, onDone) {
  const a = new Audio(url); currentAudio = a;
  a.onended = a.onerror = () => { if (onDone) onDone(); };
  a.play().catch(e => console.warn('Play error:', e));
}

function speakRandom(arr) { speak(arr[Math.floor(Math.random()*arr.length)]); }

// ── Game ──
let score, lives, streak, fuel, currentAnswer, locked, ovAnswer;
const FUEL_UP=12, FUEL_DOWN=20, MAX_FUEL=100;
const goodMsgs=['כל הכבוד, עומר! 🌟','מדהים! ⭐','נכון! 🎯','סופר! 🔥','מעולה! ✨'];
const badMsgs =['נסה שוב עומר! 💪','לא נכון 😅','עוד פעם! 🎲'];

function makeQ(){
  const op=Math.random()<0.5?'+':'-';
  let a,b,ans;
  if(op==='+'){a=Math.floor(Math.random()*91)+5;b=Math.floor(Math.random()*(100-a))+1;ans=a+b;}
  else        {a=Math.floor(Math.random()*81)+15;b=Math.floor(Math.random()*(a-1))+1;ans=a-b;}
  return {text:`${a} ${op} ${b} = ?`,answer:ans};
}

function genMain(){
  const q=makeQ(); currentAnswer=q.answer;
  document.getElementById('question-text').textContent=q.text;
}

function setFuel(v){
  fuel=Math.max(0,Math.min(MAX_FUEL,v));
  document.getElementById('fuel-bar').style.width=fuel+'%';
  document.getElementById('flame').className='flame'+(fuel>0?' active':'');
}

function particle(x,y,e){
  const p=document.createElement('div');
  p.className='particle';p.textContent=e;
  p.style.left=x+'px';p.style.top=y+'px';
  document.body.appendChild(p);
  setTimeout(()=>p.remove(),1000);
}

// ── Overlay inputs ──
function setupOv(inputId,btnId,fbId,skipId,onOk,onSkip){
  const inp=document.getElementById(inputId);
  const btn=document.getElementById(btnId);
  const fb =document.getElementById(fbId);
  const sk =document.getElementById(skipId);
  function go(){
    const val=parseInt(inp.value);
    if(isNaN(val))return;
    if(val===ovAnswer){
      inp.classList.add('correct');
      fb.className='feedback-txt good';fb.textContent='מצוין! 🌟';
      speak('מצוין עומר!');
      setTimeout(onOk,1300);
    } else {
      inp.classList.add('wrong');
      fb.className='feedback-txt bad';fb.textContent=`לא נכון 😅 התשובה: ${ovAnswer}`;
      speak('לא נכון, נסה שוב!');
      setTimeout(()=>{inp.value='';inp.className='ans-input';},1200);
    }
  }
  btn.onclick=go;
  inp.onkeydown=e=>{if(e.key==='Enter')go();};
  sk.onclick=onSkip;
}
setupOv('launch-input','launch-btn','launch-fb','launch-skip',startGame,startGame);
setupOv('gameover-input','gameover-btn','gameover-fb','gameover-skip',startGame,startGame);

// ── Main answer ──
function checkMain(){
  if(locked)return;
  const inp=document.getElementById('main-input');
  const val=parseInt(inp.value);
  if(isNaN(val))return;
  locked=true;
  const fb=document.getElementById('main-fb');

  if(val===currentAnswer){
    score+=10+streak*2; streak++;
    setFuel(fuel+FUEL_UP);
    inp.classList.add('correct');
    fb.className='feedback-txt good';
    fb.textContent=goodMsgs[Math.floor(Math.random()*goodMsgs.length)];
    document.getElementById('rocket-wrap').classList.add('boost');
    setTimeout(()=>document.getElementById('rocket-wrap').classList.remove('boost'),400);
    const r=inp.getBoundingClientRect();
    ['⭐','🌟','✨'].forEach((e,i)=>setTimeout(()=>particle(r.left+Math.random()*60,r.top,e),i*100));
    if     (streak===3)speak(V.streak3);
    else if(streak===5)speak(V.streak5);
    else speakRandom(V.correct);
    if(fuel>=MAX_FUEL){setTimeout(triggerLaunch,600);return;}
  } else {
    streak=0;lives--;
    setFuel(fuel-FUEL_DOWN);
    inp.classList.add('wrong');
    fb.className='feedback-txt bad';
    fb.textContent=badMsgs[Math.floor(Math.random()*badMsgs.length)]+` (תשובה: ${currentAnswer})`;
    document.getElementById('lives-display').textContent=lives;
    speakRandom(V.wrong);
    if(lives<=0){setTimeout(triggerGameOver,800);return;}
  }
  document.getElementById('score-display').textContent=score;
  document.getElementById('streak-display').textContent=streak;
  document.getElementById('lives-display').textContent=lives;
  setTimeout(()=>{
    inp.value='';inp.className='ans-input';
    fb.textContent='';
    genMain();locked=false;inp.focus();
  },1200);
}

function triggerLaunch(){
  speak(V.launch);
  document.getElementById('launch-score-val').textContent=score;
  document.getElementById('launch-overlay').classList.add('show');
  setTimeout(()=>{
    const q=makeQ();ovAnswer=q.answer;
    document.getElementById('launch-q').textContent=q.text;
    const inp=document.getElementById('launch-input');
    inp.value='';inp.className='ans-input';
    document.getElementById('launch-fb').textContent='';
    document.getElementById('launch-card').classList.add('show');
    setTimeout(()=>inp.focus(),80);
  },2200);
}

function triggerGameOver(){
  speak(V.gameover);
  document.getElementById('final-score').textContent=score;
  const q=makeQ();ovAnswer=q.answer;
  document.getElementById('gameover-q').textContent=q.text;
  const inp=document.getElementById('gameover-input');
  inp.value='';inp.className='ans-input';
  document.getElementById('gameover-fb').textContent='';
  document.getElementById('gameover-overlay').classList.add('show');
  setTimeout(()=>inp.focus(),80);
}

function activateSound() {
  voiceEnabled = true;
  const btn = document.getElementById('sound-btn');
  btn.textContent = '🔊 קול';
  btn.style.background = 'rgba(78,205,196,0.2)';
  btn.style.borderColor = 'rgba(78,205,196,0.5)';
  btn.style.color = '#4ecdc4';
  btn.onclick = () => speak(lastText || V.intro); // re-tap replays last phrase
  speak(V.intro);
}

function startGame(){
  score=0;lives=3;streak=0;locked=false;ovAnswer=null;
  setFuel(8);
  document.getElementById('score-display').textContent=0;
  document.getElementById('lives-display').textContent=3;
  document.getElementById('streak-display').textContent=0;
  document.getElementById('main-fb').textContent='';
  const mi=document.getElementById('main-input');mi.value='';mi.className='ans-input';
  document.getElementById('launch-overlay').classList.remove('show');
  document.getElementById('launch-card').classList.remove('show');
  document.getElementById('gameover-overlay').classList.remove('show');
  genMain();
  setTimeout(()=>mi.focus(),100);
}

document.getElementById('main-input').addEventListener('keydown',e=>{if(e.key==='Enter')checkMain();});
document.getElementById('main-btn').addEventListener('click',checkMain);

startGame();
</script>
